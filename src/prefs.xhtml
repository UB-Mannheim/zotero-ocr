    <vbox>
          <groupbox>
              <html:h2>Programs</html:h2>
              <hbox style="display: flex; align-items: center;">
                  <label value="Full location of the tesseract executable:"/>
                  <html:input type="text" id="pref-zoteroocr-ocrPath-value" style="flex: 1;" preference="extensions.zotero.zoteroocr.ocrPath"/>
              </hbox>
              <label value="When empty, some standard locations are searched for it." class="indented-pref"/>
              <html:div style="height: 12px;"/>
              <hbox style="display: flex; align-items: center;">
                  <label value="Full location of the pdftoppm executable:"/>
                  <html:input type="text" id="pref-zoteroocr-pdftoppmPath-value" style="flex: 1;" preference="extensions.zotero.zoteroocr.pdftoppmPath"/>
              </hbox>
              <label value="If the pdf.js library bundled with Zotero can render the PDF pages, this is ignored." class="indented-pref"/>
              <label value="When empty, some standard locations are searched for it." class="indented-pref"/>
              <html:div style="height: 12px;"/>
              <hbox align="center">
                  <label value="Number of parallel processes:"/>
                  <html:input type="text" id="pref-zoteroocr-parallel-value" preference="extensions.zotero.zoteroocr.parallel" size="10"/>
              </hbox>
              <label value="Used for both pdf.js page rendering and Tesseract OCR." class="indented-pref"/>
              <label value="1 disables parallelism (default is 2); values above 4 are limited to 4." class="indented-pref"/>
          </groupbox>
         <groupbox>
             <html:h2>OCR parameters</html:h2>
              <hbox align="center">
                  <label value="Choose a language/script you want to use for recognition (default is eng):"/>
                  <html:input type="text" id="pref-zoteroocr-language-value" preference="extensions.zotero.zoteroocr.language" size="30"/>
              </hbox>
              <hbox align="center">
                  <label value="Output pdf dpi (default is 300):"/>
                  <html:input type="text" id="pref-zoteroocr-outputdpi-value" preference="extensions.zotero.zoteroocr.outputDPI" size="10"/>
              </hbox>
               <hbox align="center">
                   <label value="Tesseract Page Segmentation Mode - integer from 0 to 13 (inclusive):"/>
                   <html:input type="text" id="pref-zoteroocr-psmmode-value" preference="extensions.zotero.zoteroocr.psmmode" size="10"/>
               </hbox>
         </groupbox>
        <groupbox>
            <html:h2>Output options</html:h2>
            <checkbox preference="extensions.zotero.zoteroocr.outputNote" label="Save output as a note"/>
            <checkbox id="checkbox-zoteroocr-output-pdf" preference="extensions.zotero.zoteroocr.outputPDF" label="Save output as a PDF with text layer" oncommand="document.getElementById('checkbox-zoteroocr-overwrite-pdf').disabled = !document.getElementById('checkbox-zoteroocr-output-pdf').checked"/>
            <checkbox id="checkbox-zoteroocr-overwrite-pdf" preference="extensions.zotero.zoteroocr.overwritePDF" label="Overwrite the initial PDF with the output" class="indented-pref"/>
            <checkbox preference="extensions.zotero.zoteroocr.outputHocr" label="Save output as a HTML/hocr file(s)"/>
            <!-- The next preference variable is actually a number, but we treat it as a string to avoid a special treatment with javascript here -->
             <hbox align="center" class="indented-pref">
               <label value="Maximum number of pages for which an individual HTML attachment is created:"/>
               <html:input type="text" id="pref-zoteroocr-max-html-pages" preference="extensions.zotero.zoteroocr.maximumPagesAsHtml" size="10"/>
             </hbox>
            <checkbox preference="extensions.zotero.zoteroocr.outputPNG" label="Save the intermediate images as well in the folder"/>
            <checkbox preference="extensions.zotero.zoteroocr.outputAsCopyAttachment" label="Import the resulting PDF as a copy instead of as a file link"/>
        </groupbox>
    </vbox>
